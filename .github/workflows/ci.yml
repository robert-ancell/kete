# Checks the Zig code is formatted (`zig fmt`), builds kete, its examples
# and tools, and runs its tests, on Linux, macOS and Windows (and again
# without kete's own backends, with only an app's own), and publishes
# the website (its page, images and the API reference) to GitHub Pages on
# main. Each builds for itself (kete is not cross-compiled): on Windows its
# Direct3D 11 shaders are compiled by the Windows SDK's fxc.
#
# The runners have no display and (mostly) no GPU: tests that need one
# (the Vulkan, OpenGL and Metal renderers, a Wayland compositor) skip
# themselves without it. On Windows the Direct3D 11 renderer is tested on
# WARP (Direct3D's own, on the CPU), compared with the software renderer,
# and frames are presented to a window's swap chain.
name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Check the code is formatted
        run: zig fmt --check .

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build
        run: zig build --summary all
      - name: Build the examples
        run: zig build examples --summary all
      - name: Test
        run: zig build test --summary all
      - name: Build and test without kete's own backends
        run: zig build examples test -Dbackends=false --summary all
      - name: Build without kete's own fonts
        run: zig build -Dembed-fonts=false --summary all

  site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build the website
        run: zig build site -p site --summary all
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

